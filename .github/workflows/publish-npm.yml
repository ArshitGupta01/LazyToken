name: Publish TokSmart to npm

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check .
      - run: npx --yes prettier@3.4.2 --check app.js features-ui.js graph3d.js index.html styles.css web/index.html web/mobile.html web/mobile.js tests/mobile.test.cjs tests/workspace.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python e2e/runner.py --all
      - run: node --test tests/mobile.test.cjs tests/workspace.test.cjs
      - run: node --check app.js
      - run: node --check graph3d.js
      - run: node --check features-ui.js
      - run: node npm/stage.cjs "$RUNNER_TEMP/toksmart-package"
      - run: npm pack "$RUNNER_TEMP/toksmart-package" --dry-run

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./npm/package.json').version) process.exit(1)"
      - run: node npm/stage.cjs "$RUNNER_TEMP/toksmart-package"
      - run: npm publish "$RUNNER_TEMP/toksmart-package" --access public
